<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sylph scratchpad</title>
  <style>
    :root{
      --surface:#ffffff; --surface-2:#f3f3f4; --surface-3:#e9e9eb;
      --stroke:rgba(10,10,12,.12); --text:#0b0b0d; --dim:#5b5b61; --faint:#9a9aa1;
      --accent:#0b0b0d; --accent-contrast:#ffffff; --glow:rgba(10,10,12,.18);
      --mono:"SF Mono",ui-monospace,Menlo,monospace;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --surface:#161618; --surface-2:#1f1f22; --surface-3:#2a2a2e;
        --stroke:rgba(255,255,255,.14); --text:#f4f4f6; --dim:#a2a2a9; --faint:#6a6a71;
        --accent:#fafafa; --accent-contrast:#0a0a0b; --glow:rgba(255,255,255,.5);
      }
    }
    *{box-sizing:border-box;margin:0}
    html,body{background:transparent;overflow:hidden;height:100%;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
      user-select:none;-webkit-user-select:none}
    .card{
      margin:14px; border-radius:18px; background:var(--surface);
      border:1px solid var(--stroke);
      box-shadow:0 20px 50px rgba(0,0,0,.28), 0 0 26px var(--glow);
      overflow:hidden; opacity:0; transform:translateY(10px); transition:.22s;
    }
    .card.show{opacity:1;transform:none}
    .head{display:flex;align-items:center;gap:9px;padding:13px 16px 9px}
    .head .mk{width:22px;height:22px;border-radius:7px;background:var(--accent);display:grid;place-items:center;box-shadow:0 0 10px var(--glow)}
    .head .mk svg{width:13px;height:13px;color:var(--accent-contrast)}
    .head .ttl{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--faint);letter-spacing:.6px;text-transform:uppercase;flex:1}
    .head button{border:0;background:var(--surface-2);color:var(--dim);border-radius:7px;width:26px;height:26px;cursor:pointer;font-size:14px;display:grid;place-items:center;-webkit-app-region:no-drag}
    .head button:hover{background:var(--surface-3);color:var(--text)}
    .body{padding:4px 16px 14px}
    .txt{font-size:14.5px;line-height:1.55;color:var(--text);user-select:text;-webkit-user-select:text;
      max-height:92px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
    .txt::-webkit-scrollbar{width:7px}.txt::-webkit-scrollbar-thumb{background:var(--stroke);border-radius:5px}
    .foot{display:flex;align-items:center;gap:10px;padding:0 16px 14px}
    .copy{flex:1;border:0;border-radius:10px;padding:9px;background:var(--accent);color:var(--accent-contrast);font-weight:620;font-size:13px;cursor:pointer;-webkit-app-region:no-drag;display:flex;align-items:center;justify-content:center;gap:7px;box-shadow:0 0 16px var(--glow)}
    .copy:hover{filter:brightness(1.05)}
    .copy svg{width:15px;height:15px}
    .bar{height:3px;background:var(--surface-3)}
    .bar .fill{height:100%;background:var(--accent);width:100%;transform-origin:left;box-shadow:0 0 8px var(--glow)}
    .drag{-webkit-app-region:drag;position:absolute;inset:0 0 auto 0;height:44px;z-index:0}
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="drag"></div>
    <div class="head" style="position:relative;z-index:1">
      <span class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 10v3"/><path d="M6 6v11"/><path d="M10 3v18"/><path d="M14 8v7"/><path d="M18 5v13"/><path d="M22 10v3"/></svg></span>
      <span class="ttl">Scratchpad</span>
      <button id="close" title="Dismiss">✕</button>
    </div>
    <div class="body" style="position:relative;z-index:1"><div class="txt" id="txt"></div></div>
    <div class="foot" style="position:relative;z-index:1">
      <button class="copy" id="copy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span id="copyLabel">Copy</span></button>
    </div>
    <div class="bar"><div class="fill" id="fill"></div></div>
  </div>
  <script type="module" src="scratch.js"></script>
</body>
</html>
