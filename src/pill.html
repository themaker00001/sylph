<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sylph</title>
  <style>
    :root {
      --a1: #5ad1ff; --a2: #8b7bff; --a3: #c86bff;
      --grad: linear-gradient(120deg, var(--a1), var(--a2) 55%, var(--a3));
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { background: transparent; overflow: hidden; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      user-select: none; -webkit-user-select: none; }
    .pill {
      -webkit-app-region: drag;
      width: 264px; height: 60px; margin: 14px auto 0;
      display: flex; align-items: center; gap: 13px; padding: 0 18px;
      border-radius: 32px;
      background: rgba(18, 20, 27, 0.82);
      backdrop-filter: blur(22px) saturate(1.4);
      -webkit-backdrop-filter: blur(22px) saturate(1.4);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 16px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
      color: #eef1f7; transition: border-color .3s;
    }
    .pill.live { border-color: rgba(200,107,255,0.6); }
    .orb {
      width: 30px; height: 30px; border-radius: 50%; flex: none;
      background: var(--grad); position: relative;
      box-shadow: 0 0 14px rgba(139,123,255,0.6);
    }
    .orb::after { content: ""; position: absolute; inset: 8px; border-radius: 50%;
      background: rgba(18,20,27,0.85); }
    .pill.live .orb { animation: breathe 1.3s infinite; }
    @keyframes breathe { 50% { transform: scale(1.12); box-shadow: 0 0 22px rgba(200,107,255,0.8);} }

    .bars { display: flex; align-items: center; gap: 3px; height: 26px; flex: 1; }
    .bars span { width: 3px; height: 6px; border-radius: 3px; background: var(--grad); opacity: .9; }
    .label { flex: 1; font-size: 13.5px; font-weight: 550; color: #c7cdd9; letter-spacing: .2px; }
    .hint { font-size: 11px; color: #6b7280; -webkit-app-region: no-drag; }
    .pill .bars { display: none; }
    .pill.live .bars { display: flex; }
    .pill.live .label { display: none; }
  </style>
</head>
<body>
  <div class="pill" id="pill">
    <div class="orb"></div>
    <div class="bars" id="bars"></div>
    <div class="label" id="label">Press hotkey to speak</div>
  </div>
  <script type="module" src="pill.js"></script>
</body>
</html>
