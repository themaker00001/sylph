<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sylph</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { background: transparent; overflow: hidden; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      user-select: none; -webkit-user-select: none; }
    .pill {
      -webkit-app-region: drag;
      width: 264px; height: 60px; margin: 14px auto 0;
      display: flex; align-items: center; gap: 13px; padding: 0 18px; border-radius: 32px;
      background: rgba(14, 14, 16, 0.82);
      backdrop-filter: blur(22px) saturate(1.1);
      -webkit-backdrop-filter: blur(22px) saturate(1.1);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 16px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
      color: #f4f4f6; transition: border-color .3s, box-shadow .3s;
    }
    .pill.live { border-color: rgba(255,255,255,0.45); box-shadow: 0 16px 40px rgba(0,0,0,0.5), 0 0 26px rgba(255,255,255,0.14); }
    /* white glyph-lit orb */
    .orb {
      width: 32px; height: 32px; border-radius: 9px; flex: none;
      background: #f4f4f6; display: grid; place-items: center;
      box-shadow: 0 0 14px rgba(255,255,255,0.3), inset 0 0 0 1px rgba(0,0,0,0.05);
    }
    .orb svg { width: 18px; height: 18px; color: #0a0a0b; }
    .pill.live .orb { animation: breathe 1.5s ease-in-out infinite; }
    @keyframes breathe { 50% { box-shadow: 0 0 24px rgba(255,255,255,0.85); transform: scale(1.06); } }

    .bars { display: flex; align-items: center; gap: 3px; height: 26px; flex: 1; }
    .bars span { width: 3px; height: 6px; border-radius: 3px; background: #f4f4f6; }
    .label { flex: 1; font-size: 13.5px; font-weight: 550; color: #c7c7cc; letter-spacing: .2px; }

    .pill .bars { display: none; }
    .pill.live .bars { display: flex; }
    .pill.live .label { display: none; }

    /* invisible-pill mode: just a small, unobtrusive orb */
    .pill.min { width: 44px; gap: 0; padding: 0; justify-content: center;
      background: rgba(14,14,16,0.5); border-color: rgba(255,255,255,0.08); }
    .pill.min .label, .pill.min .bars { display: none !important; }
  </style>
</head>
<body>
  <div class="pill" id="pill">
    <div class="orb">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 10v3"/><path d="M6 6v11"/><path d="M10 3v18"/><path d="M14 8v7"/><path d="M18 5v13"/><path d="M22 10v3"/></svg>
    </div>
    <div class="bars" id="bars"></div>
    <div class="label" id="label">Press hotkey to speak</div>
  </div>
  <script type="module" src="pill.js"></script>
</body>
</html>
