[package]
name = "sylph"
version = "0.1.0"
description = "Sylph — feather-light, on-device voice to text"
authors = ["themaker00001"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
device_query = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
enigo = "0.3"
arboard = "3"
base64 = "0.22"
dirs = "5"

[target.'cfg(target_os = "macos")'.dependencies]
macos-accessibility-client = "0.0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
# NOTE: do not set panic = "abort" — a panic on a worker thread (e.g. the
# hotkey poller) must not take down the whole app.
